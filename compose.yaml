name: team-health
x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:-team_health}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-team_health}
  POSTGRES_DB: ${POSTGRES_DB:-team_health}
x-app-secrets: &app-secrets
  ADMIN_USERNAME: ${ADMIN_USERNAME:-mgusev}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-passwb121}
  DEMO_USERNAME: ${DEMO_USERNAME:-demo}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
  SURVEY_RESPONSE_SECRET: ${SURVEY_RESPONSE_SECRET:-local-survey-secret}
services:
  # --- разработка (профиль по умолчанию) ---
  db:
    image: postgres:17-alpine
    environment: *postgres-credentials
    ports:
      # 5432 по умолчанию: на машине разработчика 5432 обычно уже занят
      # другим локальным постгресом.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-team_health} -d ${POSTGRES_DB:-team_health}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: dev
    command: node --watch server.js
    environment:
      !!merge <<: *app-secrets
      APP_ENV: local
      PORT: 4173
      DATABASE_URL: postgres://${POSTGRES_USER:-team_health}:${POSTGRES_PASSWORD:-team_health}@db:5432/${POSTGRES_DB:-team_health}
      DATABASE_SSL: disable
    ports:
      - "${API_PORT:-4173}:4173"
    volumes:
      # Точечные mount'ы вместо всего каталога: так контейнерный node_modules
      # не перекрывается хостовым, собранным под macOS.
      - ./server.js:/app/server.js:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  web:
    build:
      context: .
      target: dev
    command: npx vite --host 0.0.0.0
    environment:
      VITE_API_TARGET: http://api:4173
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.js:/app/vite.config.js:ro
    depends_on:
      - api
  # --- прод-подобный запуск того же образа, который поедет в k8s ---
  app:
    profiles: ["prod"]
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      !!merge <<: *app-secrets
      ADMIN_PASSWORD: ${PROD_ADMIN_PASSWORD:-change-me-locally}
      APP_ENV: production
      PORT: 4173
      DATABASE_URL: postgres://${POSTGRES_USER:-team_health}:${POSTGRES_PASSWORD:-team_health}@db:5432/${POSTGRES_DB:-team_health}
      DATABASE_SSL: disable
    ports:
      - "${PROD_PORT:-8080}:4173"
    depends_on:
      db:
        condition: service_healthy
  # --- тесты: своя база и свой сервер, dev-данные не трогаются ---
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: team_health
      POSTGRES_PASSWORD: team_health
      POSTGRES_DB: team_health_test
    # Данные тестов живут только в памяти: быстрее и не оставляет мусора между прогонами.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_health -d team_health_test"]
      interval: 3s
      timeout: 5s
      retries: 15
  api-test:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    environment:
      # Именно local: smoke-тест дёргает /api/reset, а в production он закрыт.
      # Плюс в production cookie уходит с флагом Secure, и Chromium выбросит её на http://.
      APP_ENV: local
      PORT: 4173
      DATABASE_URL: postgres://team_health:team_health@db-test:5432/team_health_test
      DATABASE_SSL: disable
      ADMIN_USERNAME: mgusev
      ADMIN_PASSWORD: passwb121
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo
      SURVEY_RESPONSE_SECRET: test-survey-secret
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/readyz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      BASE_URL: http://api-test:4173
      ADMIN_USERNAME: mgusev
      ADMIN_PASSWORD: passwb121
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo
    volumes:
      # Спеки и конфиг подхватываются без пересборки образа.
      - ./tests:/app/tests:ro
      - ./playwright.config.js:/app/playwright.config.js:ro
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    depends_on:
      api-test:
        condition: service_healthy
volumes:
  pgdata:
